name: gargano2025
description: A new Flutter project for Urlaubs-Packliste
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

  # --- Firebase ---
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/checklist.json
    - assets/data/reisekosten_config.json
    - assets/icons/   # eigener Asset-Ordner für Bilder (unabhängig von Launcher-Icons)

# ---- flutter_launcher_icons Konfiguration (auf Root-Ebene!) ----
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png      # 1024x1024 PNG, ohne runde Ecken
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#000000"
  windows:
    generate: false
  macos:
    generate: false
